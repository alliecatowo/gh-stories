# GitHub Stories - run-to-completion worker as a Cloud Run Job.
#
# COST MODEL (read before changing anything): a Job bills for every second a
# container is up. The worker is therefore NOT a daemon here: `-once` does one
# cleanup pass, drains the media queue, and exits 0 the moment the queue is
# empty (an idle run is a few seconds). In 2026-09 an older build of -once
# never exited when idle and, triggered every 2 minutes at 2 vCPU / 2 GiB with
# 2 retries, burned ~$210 in 18 days. Keep it small and bounded:
#
#   * 1 vCPU / 512Mi, task-timeout 120s, max-retries 0, taskCount 1
#   * ONE Cloud Scheduler trigger (see scheduler-jobs.sh), every 15 minutes, plus an API-started run
#     per finalized upload (coalesced to one per 10s)
#   * only the secrets the worker needs (4; Secret Manager bills per access,
#     and Cloud Run resolves every secretKeyRef at each container start)
#
# Video transcode needs more headroom: if a 60s clip OOMs or exceeds 120s,
# raise memory to 1Gi / timeout to 300s here, not the schedule.
#
# gh-stories-migrate (migrate-job.yaml) is a one-shot executed by
# scripts/deploy.sh before the API rolls. Never scheduled.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  # GHS_WORKER_JOB, default gh-stories-worker.
  name: gh-stories-worker
  labels:
    app: gh-stories
    role: worker
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          maxRetries: 0
          timeoutSeconds: 120
          serviceAccountName: gh-stories-worker@GHS_GCP_PROJECT.iam.gserviceaccount.com
          containers:
            - image: ghcr.io/alliecatowo/gh-stories:TAG
              name: worker
              args: ["worker", "-once", "-max-jobs=20", "-max-duration=90s"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - name: GHS_ENV
                  value: production
                - name: GHS_PUBLIC_URL
                  value: https://SERVICE_HOST
                - name: GHS_S3_ENDPOINT
                  value: https://R2_ACCOUNT_ID.r2.cloudflarestorage.com
                - name: GHS_S3_REGION
                  value: auto
                - name: GHS_S3_BUCKET
                  value: gh-stories-media
                - name: GHS_S3_FORCE_PATH_STYLE
                  value: "false"
                - name: GHS_WORKER_ROLE
                  value: both
                - name: GHS_MAX_UPLOAD_BYTES
                  value: "104857600"
                - name: GHS_MAX_VIDEO_SECONDS
                  value: "60"
                - name: GHS_MAX_IMAGE_PIXELS
                  value: "50000000"
                - name: GHS_DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-database-url
                      key: latest
                - name: GHS_S3_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-r2-access-key-id
                      key: latest
                - name: GHS_S3_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-r2-secret-access-key
                      key: latest
                - name: GHS_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-secret-key
                      key: latest
                # Production config validation requires the GitHub OAuth pair
                # even though the worker never serves logins.
                - name: GHS_GITHUB_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-github-client-id
                      key: latest
                - name: GHS_GITHUB_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: ghs-production-github-client-secret
                      key: latest
