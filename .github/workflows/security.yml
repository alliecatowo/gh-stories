name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.3
          experimental: true

      - name: govulncheck
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: pnpm audit
        run: mise exec -- pnpm install --frozen-lockfile && mise exec -- pnpm audit --audit-level high
