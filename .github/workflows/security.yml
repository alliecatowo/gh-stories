name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.9.3
          experimental: true

      - name: govulncheck
        run: mise exec -- go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: pnpm audit
        run: mise exec -- pnpm install --frozen-lockfile && mise exec -- pnpm audit --audit-level high
