name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation never needs publication credentials. An untrusted pull request
# runs with read-only access and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: stories
          POSTGRES_PASSWORD: stories_local_dev
          POSTGRES_DB: stories
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U stories -d stories"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same pinned Go/Node/pnpm the repository uses locally.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.3
          experimental: true

      # MinIO needs `server /data`, and a service container cannot pass a
      # command — so it runs as a step instead.
      - name: Start private object storage
        run: |
          docker run -d --name minio -p 55900:9000 \
            -e MINIO_ROOT_USER=storiesminio \
            -e MINIO_ROOT_PASSWORD=storiesminio_local_dev \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:55900/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:55900/minio/health/live >/dev/null

      # Uses the pinned mc image rather than downloading the binary: MinIO's
      # direct download URL now returns 410, and this matches what
      # infra/compose/docker-compose.yml already does locally.
      - name: Create the private media bucket
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh \
            quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c "mc alias set local http://localhost:55900 storiesminio storiesminio_local_dev && mc mb --ignore-existing local/stories-media && mc anonymous set none local/stories-media"

      - name: ffmpeg (the media worker transcodes real video)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: mise run doctor
        continue-on-error: true

      - run: mise run bootstrap
        env:
          GHS_SKIP_BROWSERS: "1"

      - run: mise run check

      - run: mise run test
        env:
          GHS_TEST_DATABASE_URL: postgres://stories:stories_local_dev@localhost:55432/stories?sslmode=disable

      - run: mise run build

      # Browser scenarios are a separate step from unit tests: they need a
      # built site and a real browser, and their failures should be
      # attributable on their own.
      - name: Install Chromium for the visual suite
        run: mise exec -- pnpm --filter @gh-stories/e2e exec playwright install --with-deps chromium

      - name: Visual scenarios (four viewports, real browser)
        run: mise exec -- pnpm --filter @gh-stories/e2e exec playwright test --project=site --project=site-mobile --project=site-360 --project=site-wide
        env:
          GHS_SKIP_EXTENSION_SETUP: "1"

      # Extension scenarios need the service running and the extension built
      # with a localhost origin in its host permissions.
      - name: Start the service for extension scenarios
        run: |
          mise exec -- go build -tags ghs_testidp -o /tmp/ghs-api ./apps/api
          mise exec -- go build -o /tmp/ghs-worker ./apps/worker
          /tmp/ghs-api -migrate
          /tmp/ghs-api > /tmp/ghs-api.log 2>&1 &
          /tmp/ghs-worker > /tmp/ghs-worker.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8787/v1/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8787/v1/health/live >/dev/null
        env:
          GHS_ENV: local
          GHS_PUBLIC_URL: http://localhost:8787
          GHS_DATABASE_URL: postgres://stories:stories_local_dev@localhost:55432/stories?sslmode=disable
          GHS_S3_ENDPOINT: http://localhost:55900
          GHS_S3_BUCKET: stories-media
          GHS_S3_ACCESS_KEY_ID: storiesminio
          GHS_S3_SECRET_ACCESS_KEY: storiesminio_local_dev
          GHS_S3_FORCE_PATH_STYLE: "true"
          GHS_SECRET_KEY: ci-only-secret-key-long-enough-0123456789abcdef
          GHS_TEST_IDENTITY_PROVIDER: "true"

      # The suite builds the extension with the right host permissions and
      # seeds the service itself, so this is just "run it".
      - name: Extension scenarios (MV3 loaded into a real Chromium)
        run: |
          mise exec -- go build -o gh-stories ./cli/gh-stories
          mise exec -- pnpm --filter @gh-stories/e2e exec playwright test --project=extension
        env:
          GHS_SERVICE_URL: http://localhost:8787

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-traces
          path: |
            evidence/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
