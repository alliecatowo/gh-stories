# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  ignore:
  # apps/site stays on TypeScript 6 because `astro check` refuses TypeScript 7
  # (astro-build/astro, language-tools/ts-content-mapper). Remove once Astro
  # ships TS 7 support, then bump apps/site to the same TypeScript as the rest.
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directories:
  - /
  - /tests/terminal
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
