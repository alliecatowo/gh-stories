# Weekly version updates. Minor and patch bumps are grouped into one PR and
# auto-merged by .github/workflows/dependabot-automerge.yml once required CI is
# green; major bumps arrive as separate PRs labelled `major-update`.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
  ignore:
  # The root and packages/contracts (openapi-typescript 7.x peers typescript
  # ^5, no JS API in TS 7) and apps/site (`astro check` refuses TS 7) stay on
  # TypeScript 6. Remove once both ship TS 7 support, then bump them.
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directories:
  - /
  - /tests/terminal
  schedule:
    interval: weekly
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
