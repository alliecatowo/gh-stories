{{define "layout"}}<!doctype html>
<html lang="en" data-color-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{.Title}} · GitHub Stories</title>
<style>
:root{--bg:#fff;--subtle:#f6f8fa;--border:#d1d9e0;--fg:#1f2328;--muted:#59636e;--accent:#0969da;--ring1:#e5486f;--ring2:#f0883e}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--subtle:#151b23;--border:#3d444d;--fg:#f0f6fc;--muted:#9198a1;--accent:#4493f8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,"Noto Sans",Helvetica,Arial,sans-serif}
header{border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px}
.mark{width:22px;height:22px;border-radius:50%;background:conic-gradient(from 180deg,var(--ring1),var(--ring2),var(--ring1));display:inline-block;flex:none}
.mark::after{content:"";display:block;margin:4px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
header b{font-weight:600}
nav{margin-left:auto;display:flex;gap:16px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
main{max-width:720px;margin:0 auto;padding:32px 20px 64px}
h1{font-size:22px;margin:0 0 8px}
h2{font-size:16px;margin:32px 0 8px}
p{color:var(--muted)}
.card{border:1px solid var(--border);border-radius:12px;padding:20px;background:var(--subtle);margin:16px 0}
.code{font:600 26px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.18em;padding:14px 18px;background:var(--bg);border:1px solid var(--border);border-radius:10px;display:inline-block}
button{font:inherit;font-weight:500;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);cursor:pointer}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form{display:flex;gap:10px;margin-top:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border)}
.err{border-color:#cf222e;color:#cf222e;background:transparent}
.muted{color:var(--muted);font-size:12px}
footer{border-top:1px solid var(--border);padding:20px;text-align:center;color:var(--muted);font-size:12px}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
img.avatar{width:24px;height:24px;border-radius:50%}
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true"></span><b>GitHub Stories</b>
  <nav>
    {{if .SignedIn}}<a href="/account">Your Stories</a><a href="/account/settings">Settings</a>{{if .User.IsModerator}}<a href="/account/moderation">Moderation</a>{{end}}{{else}}<a href="/login">Sign in</a>{{end}}
  </nav>
</header>
<main>
{{if .Error}}<div class="card err">{{.Error}}</div>{{end}}
{{template "content" .}}
</main>
<footer>
  An independent project. Not affiliated with GitHub. · {{.Version}}
</footer>
</body>
</html>{{end}}
